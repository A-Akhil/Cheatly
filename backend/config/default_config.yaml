app:
  host: "127.0.0.1"
  port: 8765
  cors_origins:
    - "*"

speech_recognition:
  enabled: false
  model_size: "base"
  language: "en"
  chunk_duration_ms: 800

model_provider:
  provider: "google"
  google_model: "gemma-3-1b-it"
  google_fallback_model: "gemini-3-flash-preview"
  ollama_model: "llama3"
  ollama_host: "http://127.0.0.1:11434"
  temperature: 0.3
  max_output_tokens: 512

rag:
  enabled: true
  sqlite_path: "./backend/context/rag_store.db"
  chunk_size: 700
  chunk_overlap: 120
  top_k: 5

audio:
  device_index: null
  sample_rate: 16000
  channels: 1

logging:
  level: "INFO"
  log_to_file: true
  file_path: "./backend/logging/backend.log"
